<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#06070A"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="168" height="168" rx="42" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>
  <circle cx="140" cy="40" r="6" fill="#38BDF8" opacity="0.95"/>

  <g filter="url(#shadow)">
    <text x="90" y="125" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Montserrat, sans-serif" 
          font-size="96" 
          font-weight="900" 
          letter-spacing="-4"
          text-anchor="middle">
      <tspan fill="#FFFFFF">4</tspan><tspan fill="url(#kGrad)">K</tspan>
    </text>
  </g>
</svg>
